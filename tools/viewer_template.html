<title>Worldbox</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:      #EDEFE9;
    --panel:   #F8F9F5;
    --line:    #CBD1C6;
    --ink:     #10130F;
    --ink-2:   #4C554B;
    --ink-3:   #79826F;
    --accent:  #1F6F78;
    --wash:    #DCE9E9;

    --war:        #A83A20;
    --plague:     #6E4795;
    --invention:  #A4761A;
    --society:    #2C6E4B;
    --birth:      #4C554B;
    --death:      #79826F;
    --milestone:  #1F6F78;

    --terr-water: #A9BCC9;
    --terr-grass: #D6DAC6;
    --terr-forest:#B2C0A2;
    --terr-mount: #C3C1BA;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      #0E1210;
      --panel:   #161B18;
      --line:    #2A322C;
      --ink:     #E5EAE3;
      --ink-2:   #A3ADA3;
      --ink-3:   #77817A;
      --accent:  #57B3B8;
      --wash:    #15302F;

      --war:        #E0714F;
      --plague:     #B08BD8;
      --invention:  #D9AC4A;
      --society:    #5FB884;
      --birth:      #A3ADA3;
      --death:      #77817A;
      --milestone:  #57B3B8;

      --terr-water: #22323D;
      --terr-grass: #2B3427;
      --terr-forest:#36442E;
      --terr-mount: #3A3A37;
    }
  }

  :root[data-theme="dark"] {
    --bg:      #0E1210;
    --panel:   #161B18;
    --line:    #2A322C;
    --ink:     #E5EAE3;
    --ink-2:   #A3ADA3;
    --ink-3:   #77817A;
    --accent:  #57B3B8;
    --wash:    #15302F;

    --war:        #E0714F;
    --plague:     #B08BD8;
    --invention:  #D9AC4A;
    --society:    #5FB884;
    --birth:      #A3ADA3;
    --death:      #77817A;
    --milestone:  #57B3B8;

    --terr-water: #22323D;
    --terr-grass: #2B3427;
    --terr-forest:#36442E;
    --terr-mount: #3A3A37;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
  }

  .app {
    max-width: 1240px;
    margin: 0 auto;
    padding: 20px clamp(12px, 3vw, 24px) 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .titlebar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .titlebar h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    margin: 0;
  }
  .titlebar .meta {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
  }

  /* map + info side by side */
  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 236px;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 840px) { .main { grid-template-columns: minmax(0, 1fr); } }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  canvas#map {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .transport {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 11px;
    border-top: 1px solid var(--line);
  }
  button {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--panel);
    background: var(--accent);
    border: none;
    border-radius: 2px;
    padding: 6px 14px;
    cursor: pointer;
    min-width: 68px;
  }
  button:hover { filter: brightness(1.12); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; min-width: 80px; }
  input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .stamp {
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--ink-2);
  }

  /* terminal-style info column */
  .info {
    font-family: var(--mono);
    font-size: 12px;
    padding: 12px;
    line-height: 1.75;
  }
  .info h2 {
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .info .row { display: flex; justify-content: space-between; gap: 8px; }
  .info .row span:first-child { color: var(--ink-2); }
  .info .row span:last-child { font-variant-numeric: tabular-nums; }
  .info hr { border: none; border-top: 1px solid var(--line); margin: 9px 0; }
  .info .era {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  /* log + commentary */
  .lower {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 840px) { .lower { grid-template-columns: minmax(0, 1fr); } }

  .pane-head {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
  }

  #log {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.7;
    height: 260px;
    overflow-y: auto;
    padding: 8px 12px;
    margin: 0;
    list-style: none;
  }
  #log li { display: flex; gap: 9px; }
  #log .d { color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #log .m { color: var(--ink-2); }
  #log li.hi .m { color: var(--ink); }

  .commentary { padding: 12px 14px; height: 260px; overflow-y: auto; }
  .commentary p { margin: 0 0 10px; color: var(--ink-2); max-width: 60ch; }
  .commentary p:last-child { margin-bottom: 0; }
  .commentary .period {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .commentary .none { color: var(--ink-3); font-style: italic; }

  footer {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <div class="titlebar">
    <h1>Worldbox</h1>
    <div class="meta" id="meta"></div>
  </div>

  <div class="main">
    <div class="card">
      <canvas id="map"></canvas>
      <div class="transport">
        <button id="play">Play</button>
        <input id="scrub" type="range" min="0" value="0" step="1" aria-label="Scrub through time" />
        <span class="stamp" id="stamp"></span>
      </div>
    </div>

    <div class="card info" id="info"></div>
  </div>

  <div class="lower">
    <div class="card">
      <div class="pane-head">Event log</div>
      <ul id="log"></ul>
    </div>
    <div class="card">
      <div class="pane-head">What is happening</div>
      <div class="commentary" id="commentary"></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script id="rundata" type="application/json">__RUN_DATA__</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("rundata").textContent);
  var frames = DATA.frames, W = DATA.width, H = DATA.height;
  var TERRAIN = ["--terr-water", "--terr-grass", "--terr-forest", "--terr-mount"];

  function token(n) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  }
  function tribeColour(i) {
    if (i < 0) return null;
    return "hsl(" + ((i * 47) % 360) + " 62% " + (52 + ((i * 13) % 16)) + "%)";
  }

  // --- pixel sprites -------------------------------------------------------
  var PERSON = [".#.", "###", ".#.", "#.#"];
  var BUILDINGS = [
    ["..x..", ".x#x.", "x###x", "#####"],
    [".xxx.", "x###x", "#o#o#", "#####"],
    ["x.xxx.x", "xx###xx", "x#o#o#x", "x#####x", "xxxxxxx"],
    [".x...x.", "xxx.xxx", "x#xxx#x", "x#o#o#x", "x#####x", "x#o#o#x", "xxxxxxx"],
    ["x.x.x.x.x", "xxxxxxxxx", "x#o#o#o#x", "x#######x", "x#o#o#o#x", "x#######x", "x#o#o#o#x", "xxxxxxxxx"]
  ];
  var cache = Object.create(null);

  function shade(c, d) {
    var m = /hsl\((\d+) (\d+)% (\d+)%\)/.exec(c);
    if (!m) return c;
    return "hsl(" + m[1] + " " + m[2] + "% " + Math.max(6, Math.min(94, +m[3] + d)) + "%)";
  }
  function sprite(bmp, colour, scale) {
    var key = bmp.length + "x" + bmp[0].length + colour + scale;
    if (cache[key]) return cache[key];
    var c = document.createElement("canvas");
    c.width = bmp[0].length * scale; c.height = bmp.length * scale;
    var g = c.getContext("2d");
    var fill = { "#": colour, "o": shade(colour, 14), "x": shade(colour, -22) };
    for (var y = 0; y < bmp.length; y++)
      for (var x = 0; x < bmp[0].length; x++) {
        var ch = bmp[y][x];
        if (ch === ".") continue;
        g.fillStyle = fill[ch] || colour;
        g.fillRect(x * scale, y * scale, scale, scale);
      }
    cache[key] = c;
    return c;
  }

  // --- canvas --------------------------------------------------------------
  var cv = document.getElementById("map"), ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  var cell = 8, terrainImage = null, index = 0, playing = false, timer = null;

  function size() {
    var dpr = window.devicePixelRatio || 1;
    cell = Math.max(3, Math.floor(cv.parentElement.clientWidth / W));
    cv.style.width = cell * W + "px";
    cv.style.height = cell * H + "px";
    cv.width = Math.round(cell * W * dpr);
    cv.height = Math.round(cell * H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }

  function paintTerrain() {
    var cols = TERRAIN.map(token);
    for (var y = 0; y < H; y++) {
      var row = DATA.terrain[y];
      for (var x = 0; x < W; x++) {
        ctx.fillStyle = cols[+row[x]];
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    terrainImage = ctx.getImageData(0, 0, cv.width, cv.height);
  }

  function draw(i) {
    var f = frames[i];
    if (terrainImage) ctx.putImageData(terrainImage, 0, 0); else paintTerrain();
    var grey = token("--ink-3");

    var bScale = Math.max(1, Math.round(cell / 4));
    for (var k = 0; k < f.s.length; k += 4) {
      var lvl = Math.max(0, Math.min(4, f.s[k + 2]));
      var sp = sprite(BUILDINGS[lvl], tribeColour(f.s[k + 3]) || grey, bScale);
      ctx.drawImage(sp,
        Math.round(f.s[k] * cell + cell / 2 - sp.width / 2),
        Math.round(f.s[k + 1] * cell + cell / 2 - sp.height / 2));
    }
    var pScale = Math.max(1, Math.round(cell / 5));
    for (var j = 0; j < f.a.length; j += 3) {
      var ps = sprite(PERSON, tribeColour(f.a[j + 2]) || grey, pScale);
      ctx.drawImage(ps,
        Math.round(f.a[j] * cell + cell / 2 - ps.width / 2),
        Math.round(f.a[j + 1] * cell + cell / 2 - ps.height / 2));
    }
  }

  // --- info column ---------------------------------------------------------
  var infoEl = document.getElementById("info");
  function info(f) {
    function row(a, b) { return '<div class="row"><span>' + a + "</span><span>" + b + "</span></div>"; }
    infoEl.innerHTML =
      "<h2>World</h2>" +
      row("Day", f.d.toLocaleString()) +
      row("Year", f.y) +
      row("Population", f.p.toLocaleString()) +
      "<hr>" +
      "<h2>Society</h2>" +
      row("Tribes", f.t) +
      row("Settlements", f.s.length / 4) +
      row("Technologies", f.k + "/16") +
      '<div class="era">' + (f.e || "pre-technological") + "</div>" +
      "<hr>" +
      "<h2>Pressures</h2>" +
      row("Wars", f.w) +
      row("Ill", f.i) +
      row("War dead", f.wd.toLocaleString()) +
      row("Plague dead", f.pd.toLocaleString()) +
      row("Wild food", Math.round(f.f * 100) + "%");
  }

  // --- log -----------------------------------------------------------------
  var logEl = document.getElementById("log");
  var KIND = { war: "--war", plague: "--plague", invention: "--invention",
               society: "--society", birth: "--birth", death: "--death",
               milestone: "--milestone" };

  function renderLog(day) {
    var shown = [];
    for (var i = 0; i < DATA.log.length; i++) {
      if (DATA.log[i].d > day) break;
      shown.push(DATA.log[i]);
    }
    shown = shown.slice(-120);
    logEl.innerHTML = shown.map(function (e, i) {
      var c = KIND[e.k] || "--ink-3";
      return '<li' + (i === shown.length - 1 ? ' class="hi"' : "") + '>' +
        '<span class="d" style="color:var(' + c + ')">' + e.d + "</span>" +
        '<span class="m">' + e.m.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span></li>";
    }).join("") || '<li><span class="m">Nothing has happened yet.</span></li>';
    logEl.scrollTop = logEl.scrollHeight;
  }

  // --- AI commentary -------------------------------------------------------
  var comEl = document.getElementById("commentary");
  function commentary(day) {
    var segs = DATA.narration || [];
    var current = null;
    for (var i = 0; i < segs.length; i++) {
      if (day >= segs[i].from) current = segs[i];
    }
    if (!current || !current.text) {
      comEl.innerHTML = '<p class="none">No account written for this period.</p>';
      return;
    }
    var y0 = Math.floor(current.from / DATA.daysPerYear);
    var y1 = Math.floor(current.to / DATA.daysPerYear);
    comEl.innerHTML = '<div class="period">Years ' + y0 + "–" + y1 + "</div>" +
      current.text.split(/\n+/).map(function (p) {
        return "<p>" + p.replace(/&/g, "&amp;").replace(/</g, "&lt;")
                        .replace(/\*\*/g, "").replace(/^#+\s*/, "") + "</p>";
      }).join("");
  }

  // --- transport -----------------------------------------------------------
  var scrub = document.getElementById("scrub");
  var stamp = document.getElementById("stamp");
  var playBtn = document.getElementById("play");

  function show(i) {
    index = Math.max(0, Math.min(frames.length - 1, i));
    var f = frames[index];
    draw(index); info(f); renderLog(f.d); commentary(f.d);
    scrub.value = index;
    stamp.textContent = "Year " + f.y;
  }
  function start() {
    playing = true; playBtn.textContent = "Pause";
    if (index >= frames.length - 1) show(0);
    clearInterval(timer);
    timer = setInterval(function () {
      if (index >= frames.length - 1) { stop(); return; }
      show(index + 1);
    }, 110);
  }
  function stop() { playing = false; playBtn.textContent = "Play"; clearInterval(timer); }

  playBtn.addEventListener("click", function () { playing ? stop() : start(); });
  scrub.addEventListener("input", function () { stop(); show(+scrub.value); });

  function repaint() { size(); terrainImage = null; cache = Object.create(null); paintTerrain(); show(index); }
  window.addEventListener("resize", repaint);
  if (window.matchMedia)
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
  new MutationObserver(repaint).observe(document.documentElement,
    { attributes: true, attributeFilter: ["data-theme"] });

  // --- go ------------------------------------------------------------------
  var last = frames[frames.length - 1];
  document.getElementById("meta").textContent =
    "seed " + DATA.seed + " · " + W + "×" + H + " · " + last.y + " years";
  document.getElementById("foot").textContent =
    "Replay of a headless Python run. " + frames.length + " frames, one per 100 days. " +
    "Commentary written by Gemini from the simulation's own chronicle.";
  scrub.max = frames.length - 1;
  size(); paintTerrain(); show(0);
})();
</script>
